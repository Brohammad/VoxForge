name: Nightly smoke

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-smoke
  cancel-in-progress: true

jobs:
  live-provider-secrets-check:
    runs-on: ubuntu-latest
    outputs:
      live_provider_enabled: ${{ steps.check.outputs.live_provider_enabled }}
    steps:
      - name: Check live provider secrets
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          if [[ -n "${OPENAI_API_KEY}" && -n "${DEEPGRAM_API_KEY}" && -n "${CARTESIA_API_KEY}" ]]; then
            echo "live_provider_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "live_provider_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Live provider smoke skipped because OPENAI_API_KEY, DEEPGRAM_API_KEY, and/or CARTESIA_API_KEY are not configured."
          fi

  live-provider-smoke:
    runs-on: ubuntu-latest
    needs: live-provider-secrets-check
    if: needs.live-provider-secrets-check.outputs.live_provider_enabled == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Live provider smoke (time-boxed subset)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          pytest tests/live/test_providers_live.py -m live \
            -k "openai_streaming or deepgram_connection or cartesia_tts" \
            -v --tb=short --maxfail=1

  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STT_PROVIDER: mock
      LLM_PROVIDER: mock
      TTS_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      DATABASE_URL: postgresql+asyncpg://voxforge@localhost:5432/voxforge
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: nightly-load-smoke-secret-key-32-chars-min
      API_KEY_HASH_PEPPER: nightly-load-smoke-pepper-value
      RATE_LIMIT_ENABLED: "false"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voxforge
          POSTGRES_PASSWORD: voxforge
          POSTGRES_DB: voxforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install locust

      - name: Run database migrations
        run: alembic upgrade head

      - name: Start app
        run: |
          uvicorn voxforge.main:app --app-dir src --host 127.0.0.1 --port 8000 &

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time"
          exit 1

      - name: Load smoke (cheap headless run)
        run: |
          locust -f scripts/load/locustfile.py --host http://127.0.0.1:8000 \
            --headless -u 10 -r 2 -t 30s --only-summary
